name: Fix AutoPlay Home Top Spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-top-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Home top spacing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/gokul/autoplay/CloudMainActivity.kt")
          text = path.read_text()
          old = 'modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 8.dp),'
          new = 'modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 8.dp).padding(top = 20.dp),'

          if old in text:
              path.write_text(text.replace(old, new, 1))
              print("Top spacing updated: +20dp (28dp total top spacing).")
          else:
              print("Target line already updated or not found; no change needed.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/gokul/autoplay/CloudMainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: add top spacing to AutoPlay home screen"
          git push origin HEAD:main
