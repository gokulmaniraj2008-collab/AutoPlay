name: Tommy Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI only needs valid-shaped public values so Next.js can prerender the client.
  # Production values remain configured in Vercel.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install

      - name: Build Tommy Web
        run: npm run build

      - name: Upload Next.js build metadata
        uses: actions/upload-artifact@v4
        with:
          name: tommy-web-next-build
          path: |
            web/.next
            web/public
          if-no-files-found: warn
