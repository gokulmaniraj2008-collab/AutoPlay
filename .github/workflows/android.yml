name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.0/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Rename APK
        working-directory: .
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AutoPlay.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlay-debug-apk
          path: AutoPlay.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AutoPlay Android v1.0.${{ github.run_number }}
          body: |
            ## AutoPlay Android App

            Android APK built automatically from the `main` branch.

            **Download:** AutoPlay.apk
          files: AutoPlay.apk
          generate_release_notes: true

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlay-build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
